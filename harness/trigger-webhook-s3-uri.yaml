# Custom webhook: POST JSON body; map fields with <+trigger.payload.*>.
# After create, copy Webhook URL from Pipeline Studio → Triggers → CACM S3 URI Webhook.
#
# Minimal curl:
#   curl -X POST "$WEBHOOK_URL" -H 'Content-Type: application/json' \
#     -d '{"object_uri_s3":"s3://YOUR-BUCKET/path/monthly.csv"}'
#
# Optional JSON fields: invoice_period, validate_only, provider_type, derive_invoice_period_from_csv
# Secret/region refs use pipeline defaults unless overridden in inputYaml below.
trigger:
  name: CACM S3 URI Webhook
  identifier: cacm_s3_uri_webhook
  enabled: true
  description: Trigger CACM external cost ingest with S3 URI from a curl/webhook payload
  tags:
    cacm: external-ingest
  orgIdentifier: YOUR_ORG
  projectIdentifier: YOUR_PROJECT
  pipelineIdentifier: cacm_external_cost_ingest
  source:
    type: Webhook
    spec:
      type: Custom
      spec:
        payloadConditions: []
        headerConditions: []
        jexlCondition: ""
  inputYaml: |
    pipeline:
      identifier: cacm_external_cost_ingest
      variables:
        - name: provider_id
          type: String
          value: YOUR_PROVIDER_UUID
        - name: provider_type
          type: String
          value: snowflake
        - name: invoice_period
          type: String
          value: <+trigger.payload.invoice_period>
        - name: derive_invoice_period_from_csv
          type: String
          value: "true"
        - name: object_uri_s3
          type: String
          value: <+trigger.payload.object_uri_s3>
        - name: use_sample
          type: String
          value: "false"
        - name: validate_only
          type: String
          value: <+trigger.payload.validate_only>
        - name: git_branch
          type: String
          value: main
        # Optional overrides (defaults match suggested secret ids / us-east-1):
        # - name: harness_api_key_secret
        #   type: String
        #   value: harness_ccm_api_key
        # - name: aws_access_key_secret
        #   type: String
        #   value: account.aws_access_key_id
        # - name: aws_secret_key_secret
        #   type: String
        #   value: account.aws_secret_access_key
        # - name: aws_session_token_secret
        #   type: String
        #   value: account.aws_session_token
        # - name: aws_default_region
        #   type: String
        #   value: us-east-1
